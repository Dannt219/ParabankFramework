name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression
      browser:
        description: 'Browser'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ github.event.inputs.suite || 'smoke' }} on ${{ github.event.inputs.browser || 'chrome' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify Chrome installation
        run: google-chrome --version

      - name: Resolve test suite & browser
        id: params
        run: |
          echo "suite=${{ github.event.inputs.suite || 'smoke' }}" >> $GITHUB_OUTPUT
          echo "browser=${{ github.event.inputs.browser || 'chrome' }}" >> $GITHUB_OUTPUT

      - name: Run tests
        run: |
          mvn -B -ntp clean test \
            -Dsurefire.suiteXmlFiles=src/test/resources/testng-${{ steps.params.outputs.suite }}.xml \
            -Dheadless=true \
            -Dbrowser=${{ steps.params.outputs.browser }}

      - name: Generate Allure HTML report
        if: always()
        run: mvn -B -ntp allure:report

      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          retention-days: 14

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
          retention-days: 14

      - name: Upload application logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: target/logs
          retention-days: 7

  deploy-report:
    name: Publish Allure report to GitHub Pages
    needs: test
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Allure HTML report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: ./report

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
